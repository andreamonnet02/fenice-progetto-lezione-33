<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login utente</title>
  <link rel="stylesheet" href="/login-utente.css">
</head>
<body class="login-user-page">
  <main class="login-user-card">
    <p class="eyebrow">Area riservata</p>
    <h1>Login utente</h1>

    <form action="/login-utente" method="POST" class="login-form">
      <label>
        Username
        <input type="text" name="username" required>
      </label>

      <label>
        Password
        <input type="password" name="password" required>
      </label>

      <button type="submit">Accedi</button>
    </form>

    <p class="switch-link">
      Non hai un account? <a href="/iscrizione">Registrati</a>
    </p>

    <p class="switch-link secondary-link">
      <a href="/home">Torna alla home</a>
    </p>

    <div id="error-message" class="error-message" aria-live="polite"></div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === '1') {
      document.getElementById('error-message').textContent = 'Credenziali non valide. Riprova.';
    }
  </script>
</body>
</html>
